<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart-Energy-Connect - Energy Listings</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #08111f;
      color: white;
      overflow-x: hidden;
    }

    /* ── Nav ── */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 8%;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(8px);
      position: fixed;
      width: 100%;
      z-index: 1000;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #00ffb3;
    }

    nav ul {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      transition: 0.3s;
    }

    nav ul li a:hover {
      color: #00ffb3;
    }

    /* ── Page hero banner ── */
    .page-hero {
      padding: 160px 8% 80px;
      background:
        linear-gradient(rgba(0,0,0,0.7), rgba(8,17,31,1)),
        url('https://images.unsplash.com/photo-1466611653911-95081537e5b7?q=80&w=1600&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
    }

    .page-hero h1 {
      font-size: 52px;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .page-hero h1 span {
      color: #00ffb3;
    }

    .page-hero p {
      font-size: 18px;
      color: #d6d6d6;
      max-width: 620px;
      line-height: 1.7;
    }

    /* ── Sections ── */
    section {
      padding: 80px 8%;
    }

    .section-title {
      text-align: center;
      margin-bottom: 50px;
    }

    .section-title h2 {
      font-size: 38px;
      color: #00ffb3;
      margin-bottom: 10px;
    }

    .section-title p {
      color: #aaa;
      font-size: 16px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #00ffb3;
      color: #08111f;
      text-decoration: none;
      border-radius: 40px;
      font-weight: bold;
      transition: 0.3s;
      border: none;
      cursor: pointer;
      font-size: 15px;
    }

    .btn:hover {
      transform: translateY(-3px);
      background: white;
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #00ffb3;
      color: #00ffb3;
      padding: 10px 24px;
      border-radius: 40px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-outline:hover {
      background: #00ffb3;
      color: #08111f;
    }

    /* ── Status badges ── */
    .badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-open    { background: rgba(0,255,179,0.15); color: #00ffb3; border: 1px solid #00ffb3; }
    .badge-matched { background: rgba(255,200,0,0.15);  color: #ffc800; border: 1px solid #ffc800; }
    .badge-settled { background: rgba(100,200,100,0.15);color: #64c864; border: 1px solid #64c864; }
    .badge-expired { background: rgba(255,80,80,0.15);  color: #ff5050; border: 1px solid #ff5050; }

    /* ── Stats row ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }

    .stat-box {
      background: #111c2e;
      padding: 30px 20px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .stat-box h2 {
      font-size: 40px;
      color: #00ffb3;
      margin-bottom: 6px;
    }

    .stat-box p {
      color: #aaa;
      font-size: 14px;
    }

    /* ── Filter bar ── */
    .filter-bar {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 36px;
      background: #111c2e;
      padding: 20px 24px;
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .filter-bar label {
      color: #aaa;
      font-size: 14px;
      white-space: nowrap;
    }

    .filter-bar select,
    .filter-bar input[type="text"] {
      padding: 10px 14px;
      background: #08111f;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: white;
      font-size: 14px;
      outline: none;
    }

    .filter-bar select:focus,
    .filter-bar input:focus {
      border-color: #00ffb3;
    }

    /* ── Listings table ── */
    .market {
      background: #0d1728;
      border-radius: 20px;
      padding: 32px;
      overflow-x: auto;
      border: 1px solid rgba(255,255,255,0.06);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    thead th {
      text-align: left;
      padding: 14px 16px;
      color: #00ffb3;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    tbody tr {
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.2s;
    }

    tbody tr:hover {
      background: rgba(0,255,179,0.04);
    }

    tbody td {
      padding: 16px;
      font-size: 14px;
      color: #d6d6d6;
    }

    .green { color: #00ffb3; font-weight: bold; }

    /* ── Post listing form ── */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 13px;
      color: #aaa;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group input,
    .form-group select {
      padding: 14px 16px;
      background: #111c2e;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: white;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #00ffb3;
    }

    .form-group input::placeholder {
      color: #555;
    }

    .form-card {
      background: #111c2e;
      border-radius: 20px;
      padding: 40px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .form-card h3 {
      color: #00ffb3;
      font-size: 22px;
      margin-bottom: 8px;
    }

    .form-card p {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .form-footer {
      margin-top: 28px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .price-bounds {
      font-size: 13px;
      color: #aaa;
    }

    .price-bounds span {
      color: #00ffb3;
    }

    /* ── Info cards ── */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
    }

    .card {
      background: #111c2e;
      padding: 30px;
      border-radius: 20px;
      transition: 0.3s;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: #00ffb3;
    }

    .card h3 {
      margin-bottom: 12px;
      color: #00ffb3;
      font-size: 17px;
    }

    .card p {
      color: #aaa;
      font-size: 14px;
      line-height: 1.6;
    }

    /* ── Notice banner ── */
    .notice {
      background: rgba(0,255,179,0.07);
      border: 1px solid rgba(0,255,179,0.25);
      border-radius: 12px;
      padding: 16px 22px;
      font-size: 14px;
      color: #c0fff1;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .notice span {
      font-size: 20px;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: #050b14;
      color: #aaa;
    }

    @media(max-width: 768px) {
      .page-hero h1 { font-size: 34px; }
      nav ul { display: none; }
      .form-card { padding: 24px; }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="navbar">
    <div class="title">
      Trade Matching Dashboard
    </div>

    <div class="wallet-box" id="wallet">
      Wallet Not Connected
    </div>
  </div>

  <div class="grid">

    <!-- CREATE ORDER -->

    <div class="card">

      <h2>Create Trade</h2>

      <div class="form-group">
        <label>Item Offered</label>
        <input id="itemOffered" placeholder="e.g. Apple">
      </div>

      <div class="form-group">
        <label>Item Wanted</label>
        <input id="itemWanted" placeholder="e.g. Banana">
      </div>

      <button onclick="connectWallet()">
        Connect Wallet
      </button>

      <button onclick="createOrder()">
        Create Trade
      </button>

    </div>

    <!-- MATCHING -->

    <div class="card">

      <h2>Trade Matching</h2>

      <p>
        Select two compatible trades manually
        or run automated matching.
      </p>

      <div class="actions">

        <button onclick="manualMatch()">
          Manual Match
        </button>

        <button
          class="secondary-btn"
          onclick="runAutoMatch()">
          Auto Match
        </button>

      </div>

      <div id="matchStatus"></div>

    </div>

  </div>

  <!-- ORDERS -->

  <div class="card full-width">

    <h2>Open Trades</h2>

    <button onclick="loadOrders()">
      Refresh Orders
    </button>

    <table>

      <thead>
      <tr>
        <th>Select</th>
        <th>ID</th>
        <th>Owner</th>
        <th>Offers</th>
        <th>Wants</th>
        <th>Status</th>
      </tr>
      </thead>

      <tbody id="ordersTable"></tbody>

    </table>

  </div>

</div>

<script>

  // ==========================
  // CONFIG
  // ==========================

  const CONTRACT_ADDRESS = "YOUR_CONTRACT_ADDRESS";

  const ABI = [
    "function createTrade(string memory offered,string memory wanted) public",
    "function matchTrades(uint256 a,uint256 b) public",
    "function getTrade(uint256 id) public view returns(tuple(address owner,string offered,string wanted,bool matched))",
    "function tradeCounter() public view returns(uint256)"
  ];

  let provider;
  let signer;
  let contract;

  let selectedTrades = [];

  // ==========================
  // CONNECT WALLET
  // ==========================

  async function connectWallet(){

    if(!window.ethereum){
      alert("MetaMask required");
      return;
    }

    provider = new ethers.BrowserProvider(window.ethereum);

    await provider.send("eth_requestAccounts", []);

    signer = await provider.getSigner();

    contract = new ethers.Contract(
      CONTRACT_ADDRESS,
      ABI,
      signer
    );

    const address = await signer.getAddress();

    document.getElementById("wallet")
      .innerText =
      address.slice(0,6) + "..." +
      address.slice(-4);

    loadOrders();
  }

  // ==========================
  // CREATE ORDER
  // ==========================

  async function createOrder(){

    try{

      const offered =
        document.getElementById("itemOffered").value;

      const wanted =
        document.getElementById("itemWanted").value;

      const tx =
        await contract.createTrade(
          offered,
          wanted
        );

      await tx.wait();

      alert("Trade Created");

      loadOrders();

    }catch(err){
      console.error(err);
      alert("Transaction Failed");
    }
  }

  // ==========================
  // LOAD ORDERS
  // ==========================

  async function loadOrders(){

    const tbody =
      document.getElementById("ordersTable");

    tbody.innerHTML = "";

    const total =
      await contract.tradeCounter();

    for(let i=0;i<total;i++){

      const t =
        await contract.getTrade(i);

      const row =
        document.createElement("tr");

      row.innerHTML = `
        <td>
          ${
            !t.matched
            ? `<input
                type="checkbox"
                onchange="toggleTrade(${i})"
              />`
            : ""
          }
        </td>

        <td>${i}</td>

        <td>
          ${t.owner.slice(0,6)}...
        </td>

        <td>${t.offered}</td>

        <td>${t.wanted}</td>

        <td class="${
          t.matched
          ? 'status-matched'
          : 'status-open'
        }">
          ${
            t.matched
            ? 'Matched'
            : 'Open'
          }
        </td>
      `;

      tbody.appendChild(row);
    }
  }

  // ==========================
  // TOGGLE SELECT
  // ==========================

  function toggleTrade(id){

    if(selectedTrades.includes(id)){

      selectedTrades =
        selectedTrades.filter(
          t => t !== id
        );

    }else{

      if(selectedTrades.length >= 2){
        alert("Select only 2 trades");
        return;
      }

      selectedTrades.push(id);
    }

    console.log(selectedTrades);
  }

  // ==========================
  // MANUAL MATCH
  // ==========================

  async function manualMatch(){

    if(selectedTrades.length !== 2){
      alert("Select 2 trades");
      return;
    }

    try{

      document.getElementById(
        "matchStatus"
      ).innerText =
      "Matching trades...";

      const tx =
        await contract.matchTrades(
          selectedTrades[0],
          selectedTrades[1]
        );

      await tx.wait();

      document.getElementById(
        "matchStatus"
      ).innerText =
      "Trades matched successfully";

      selectedTrades = [];

      loadOrders();

    }catch(err){

      console.error(err);

      document.getElementById(
        "matchStatus"
      ).innerText =
      "Match failed";
    }
  }

  // ==========================
  // AUTO MATCH
  // ==========================

  async function runAutoMatch(){

    const total =
      await contract.tradeCounter();

    const trades = [];

    for(let i=0;i<total;i++){

      const t =
        await contract.getTrade(i);

      trades.push({
        id:i,
        owner:t.owner,
        offered:t.offered,
        wanted:t.wanted,
        matched:t.matched
      });
    }

    for(let i=0;i<trades.length;i++){

      for(let j=i+1;j<trades.length;j++){

        const a = trades[i];
        const b = trades[j];

        if(a.matched || b.matched)
          continue;

        if(
          a.offered === b.wanted &&
          a.wanted === b.offered
        ){

          try{

            const tx =
              await contract.matchTrades(
                a.id,
                b.id
              );

            await tx.wait();

          }catch(err){
            console.error(err);
          }
        }
      }
    }

    loadOrders();

    document.getElementById(
      "matchStatus"
    ).innerText =
    "Automated matching completed";
  }

</script>

</body>
</html>
